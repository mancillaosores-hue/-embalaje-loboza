/* ============================================================
   VENTANA DE ENTREGA — DINÁMICA según el día de la semana.
   Lunes a viernes: 18:00 a 22:00 (Diego reparte después del trabajo).
   Sábado y domingo: en cualquier horario, hasta las 22:00.
   ============================================================ */
const HORA_FIN_ENTREGA = '22:00';
const HORA_INICIO_ENTREGA_SEMANA = '18:00';
function esFinDeSemana(fecha){
  const dia = (fecha || new Date()).getDay(); // 0=domingo, 6=sábado
  return dia === 0 || dia === 6;
}
function horarioEntregaHoy(){

}
// Compatibilidad hacia atrás con código que aún referencia estas constantes fijas

/* ============================================================
   RUTA DE REPARTO — orden lógico de torres y detección de piso.
   Diego reparte solo, físicamente, y sube el edificio. La ruta
   entra por la Torre D y baja desde el depto de número más alto
   al más bajo, luego C, luego B, luego A (en ese orden fijo).
   ============================================================ */
/* ============================================================
   FIX: "a" y "A" (o " A " con espacios) se trataban como torres
   DISTINTAS en todas partes (login, agrupación en admin, ruta de
   reparto, gráficos). normalizaTorre() centraliza la limpieza
   (recorta espacios + mayúsculas) para que SIEMPRE se compare/
   guarde/muestre de forma consistente sin importar cómo la haya
   tecleado el cliente.
   ============================================================ */
function normalizaTorre(torre){
  return String(torre||'').trim().toUpperCase();
}

const ORDEN_TORRES_RUTA = ['D','C','B','A'];
function ordenTorre(torre){
  const idx = ORDEN_TORRES_RUTA.indexOf(normalizaTorre(torre));
  return idx === -1 ? ORDEN_TORRES_RUTA.length : idx;
}
function numeroDepto(depto){
  const digitos = String(depto||'').replace(/\D/g,'');
  return digitos ? parseInt(digitos,10) : 0;
}
/* Convención estándar de edificios: los últimos 2 dígitos son el
   número de unidad dentro del piso; lo que queda antes es el piso.
   Ej: "101"->piso 1, "205"->piso 2, "1203"->piso 12. */
function pisoDeDepto(depto){
  const digitos = String(depto||'').replace(/\D/g,'');
  if (!digitos) return null;
  if (digitos.length <= 2) return parseInt(digitos[0],10);
  return parseInt(digitos.slice(0, digitos.length-2),10);
}

const PRECIOS_BIDON = { '20L': 2000, '12L': 1500 };
let CATALOGO_PRODUCTOS = [];

async function cargarCatalogoProductos(forzar = false){
  if (CATALOGO_PRODUCTOS.length > 0 && !forzar) return CATALOGO_PRODUCTOS;
  try {
    const { data, error } = await supabaseClient.from('productos').select('*').eq('activo', true).order('nombre');
    if (error) throw error;
    if (data && data.length > 0) { CATALOGO_PRODUCTOS = data; return CATALOGO_PRODUCTOS; }
  } catch(e){ console.warn('Tabla "productos" no disponible aún, usando catálogo de respaldo:', e); }
  CATALOGO_PRODUCTOS = Object.keys(PRECIOS_BIDON).map((tipo) => ({
    id: 'legado-' + tipo, nombre: 'Bidón ' + tipo, precio: PRECIOS_BIDON[tipo], categoria:'Bidones', emoji:'💧', activo:true, es_legado:true
  }));
  return CATALOGO_PRODUCTOS;
}
function productoPorId(id){ return CATALOGO_PRODUCTOS.find(p => String(p.id)===String(id)); }

function obtenerCarrito(){
  try { return JSON.parse(safeStorage.getItem(CARRITO_KEY) || '[]'); } catch(e){ return []; }
}
function guardarCarrito(items){ safeStorage.setItem(CARRITO_KEY, JSON.stringify(items)); }
function vaciarCarrito(){ safeStorage.removeItem(CARRITO_KEY); }
function totalCarrito(items){ return items.reduce((a,it)=>a + (it.precio * it.cantidad), 0); }
function cantidadTotalCarrito(items){ return items.reduce((a,it)=>a + it.cantidad, 0); }
function agregarAlCarrito(producto, delta){
  const items = obtenerCarrito();
  const idx = items.findIndex(it => String(it.producto_id)===String(producto.id));
  if (idx >= 0) {
    items[idx].cantidad = Math.max(0, items[idx].cantidad + delta);
    if (items[idx].cantidad === 0) items.splice(idx,1);
  } else if (delta > 0) {
    items.push({ producto_id: producto.id, nombre: producto.nombre, precio: producto.precio, emoji: producto.emoji || '💧', cantidad: delta });
  }
  guardarCarrito(items);
  return items;
}
function cantidadEnCarrito(productoId){
  const it = obtenerCarrito().find(x => String(x.producto_id)===String(productoId));
  return it ? it.cantidad : 0;
}

function gotaMascota(size = 64, mood = 'feliz', extraClass = '') {
  const caras = {
    feliz:  `<circle cx="26" cy="42" r="3.4" fill="#0c4a6e"/><circle cx="42" cy="42" r="3.4" fill="#0c4a6e"/><path d="M24 50 Q34 58 44 50" stroke="#0c4a6e" stroke-width="3" fill="none" stroke-linecap="round"/>`,

    fiesta: `<circle cx="26" cy="41" r="3.6" fill="#0c4a6e"/><circle cx="42" cy="41" r="3.6" fill="#0c4a6e"/><path d="M22 49 Q34 62 46 49" stroke="#0c4a6e" stroke-width="3.4" fill="none" stroke-linecap="round"/>`,
    triste: `<circle cx="26" cy="44" r="3.2" fill="#0c4a6e"/><circle cx="42" cy="44" r="3.2" fill="#0c4a6e"/><path d="M24 54 Q34 47 44 54" stroke="#0c4a6e" stroke-width="3" fill="none" stroke-linecap="round"/>`,
    dormida:`<path d="M22 42 Q26 45 30 42" stroke="#0c4a6e" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M38 42 Q42 45 46 42" stroke="#0c4a6e" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M28 52 Q34 55 40 52" stroke="#0c4a6e" stroke-width="3" fill="none" stroke-linecap="round"/>`
  };
  return `
  <svg class="${extraClass}" width="${size}" height="${size}" viewBox="0 0 68 80" xmlns="http://www.w3.org/2000/svg">

        <stop offset="0%" stop-color="#7dd3fc"/>
        <stop offset="100%" stop-color="#0284c7"/>
      </linearGradient>
    </defs>
    <path d="M34 2 C34 2 4 40 4 58 C4 76 20 78 34 78 C48 78 64 76 64 58 C64 40 34 2 34 2 Z" fill="url(#gotaGrad)"/>
    <ellipse cx="22" cy="24" rx="6" ry="9" fill="#ffffff" opacity=".35"/>
    ${caras[mood] || caras.feliz}
  </svg>`;
}

/* ============================================================
   MASCOTA "GOTA" — personaje ilustrado en PNG (nuevo)
   Muestra al personaje de AguaTorre con distintas variantes según
   el momento del cliente en la app:
     - 'base'      -> saludo/pulgar arriba (login, bienvenida)
     - 'pedido'    -> abrazando un bidón (haciendo/en curso un pedido)
     - 'entregado' -> con capa "ENTREGADO" (pedido ya entregado)
   Los archivos deben subirse a la carpeta "assets/" del repo, junto
   a index.html, con estos nombres exactos:
     imgMascotas/mascota-base.png
     imgMascotas/mascota-pedido.png
     imgMascotas/mascota-entregado.png
   Si el archivo aún no existe (404), cae automáticamente en la gota
   SVG de respaldo para que la app nunca se vea rota.
   ============================================================ */
const MASCOTA_ARCHIVOS = {
  base: 'imgMascotas/mascota-base.png',
  pedido: 'imgMascotas/mascota-pedido.png',
  entregado: 'imgMascotas/mascota-entregado.png',
  nivel: 'imgMascotas/mascota-nivel.png',
  referidos: 'imgMascotas/mascota-referidos.png',
  recompensa: 'imgMascotas/mascota-recompensa.png',
  vacio: 'imgMascotas/mascota-vacio.png',
  dormida: 'imgMascotas/mascota-dormida.png'
};
let _mascotaImgContador = 0;
function mascotaImg(variante = 'base', size = 96, extraClass = ''){
  const archivo = MASCOTA_ARCHIVOS[variante] || MASCOTA_ARCHIVOS.base;
  const moodsRespaldoPorVariante = { entregado:'fiesta', pedido:'guiño', nivel:'fiesta', referidos:'guiño', recompensa:'fiesta', vacio:'triste', dormida:'dormida', base:'feliz' };
  const moodRespaldo = moodsRespaldoPorVariante[variante] || 'feliz';
  const idUnico = 'mascota-img-' + (_mascotaImgContador++);
  /* FIX: JSON.stringify() genera un literal de string JS 100% válido
     (escapa comillas dobles, barras y saltos de línea correctamente),
     evitando romper el HTML como pasaría con un reemplazo manual de
     comillas. Se embebe dentro de un atributo onerror con COMILLA
     SIMPLE para que las comillas dobles del SVG no cierren el
     atributo antes de tiempo. */
  const svgRespaldo = gotaMascota(size, moodRespaldo, extraClass);
  const svgComoLiteralJS = JSON.stringify(svgRespaldo);
  return `<img id="${idUnico}" src="${archivo}" alt="AguaTorre" width="${size}" height="${size}" class="${extraClass}"
    style="width:${size}px;height:${size}px;object-fit:contain;display:inline-block;"
    onerror='this.onerror=null; document.getElementById("${idUnico}").outerHTML = ${svgComoLiteralJS};'>`;
}

const NIVELES = [
  { min: 0,    nombre: 'Gota Inicial',   emoji:'💧', color:'from-sky-300 to-sky-400' },
  { min: 200,  nombre: 'Gota Activa',    emoji:'💧', color:'from-sky-400 to-cyan-500' },
  { min: 500,  nombre: 'Gota Frecuente', emoji:'💧', color:'from-cyan-500 to-blue-500' },
  { min: 1000, nombre: 'Gota Experta',   emoji:'💧', color:'from-blue-500 to-indigo-500' },
  { min: 2000, nombre: 'Gota Premium',   emoji:'💎', color:'from-indigo-500 to-purple-500' },
  { min: 4000, nombre: 'Gota Leyenda',   emoji:'👑', color:'from-amber-400 to-orange-500' },
];
function infoNivel(puntosTotales){
  puntosTotales = puntosTotales || 0;
  let idx = 0;
  for (let i=0;i<NIVELES.length;i++){ if (puntosTotales >= NIVELES[i].min) idx = i; }
  const actual = NIVELES[idx];
  const siguiente = NIVELES[idx+1] || null;
  const base = actual.min;
  const tope = siguiente ? siguiente.min : base + 1000;
  const pct = siguiente ? Math.min(100, Math.round(((puntosTotales-base)/(tope-base))*100)) : 100;
  return { idx, actual, siguiente, pct, puntos: puntosTotales, faltan: siguiente ? (tope - puntosTotales) : 0, tope };
}
function puntosTotalesDe(cliente){
  return (cliente && (cliente.puntos_totales != null ? cliente.puntos_totales : cliente.puntos)) || 0;
}

const MULTIPLICADOR_POR_NIVEL = [1, 1.05, 1.10, 1.15, 1.20, 1.30];
function conBonusNivel(puntosBase, nivelIdx){
  const mult = MULTIPLICADOR_POR_NIVEL[nivelIdx] != null ? MULTIPLICADOR_POR_NIVEL[nivelIdx] : 1;
  return Math.round(puntosBase * mult);
}

const PUNTOS_POR_BIDON = 100;
const PUNTOS_POR_RACHA_DIA = 20;
const PUNTOS_POR_REFERIDO_INVITADOR = 200;
const PUNTOS_POR_REFERIDO_INVITADO = 100;

const ESTADOS_PEDIDO = ['solicitado','entregado','cancelado'];
function normalizaEstado(estado){
  if (estado === 'pendiente') return 'solicitado';
  if (estado === 'pagado') return 'entregado';
  if (estado === 'preparando' || estado === 'en_camino') return 'solicitado';
  if (!estado) return 'solicitado';
  return estado;
}
function estadoLabel(estadoRaw){
  const estado = normalizaEstado(estadoRaw);
  const map = { solicitado: 'Solicitado 📝', entregado: 'Entregado ✅', cancelado: 'Cancelado ❌' };
  return map[estado] || estado;
}
function estadoColor(estadoRaw){
  const estado = normalizaEstado(estadoRaw);
  const map = { solicitado: 'bg-amber-100 text-amber-700', entregado: 'bg-green-100 text-green-700', cancelado: 'bg-red-100 text-red-700' };
  return map[estado] || 'bg-slate-100 text-slate-600';
}

function showToast(msg, ms=2600, esError=false){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast pop-in' + (esError ? ' toast-error' : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(), 300); }, esError ? ms+2000 : ms);
}
function lanzarConfeti(emoji='💧', cantidad=14){

    const el = document.createElement('div');
    el.className = 'confetti-emoji';
    el.textContent = emoji;
    el.style.left = Math.random()*100 + 'vw';
    el.style.animationDuration = (1.6 + Math.random()*1.2) + 's';
    el.style.fontSize = (14 + Math.random()*14) + 'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 3200);
  }
}

   MODAL DE CELEBRACIÓN — se muestra al subir de nivel, con la

      <p class="text-slate-600 text-sm mt-1">Ahora eres</p>

/* ============================================================
   CAPTURA DE IMAGEN — usa html2canvas para convertir un div en
   PNG y lo comparte directamente (Web Share API con archivos, si
   el navegador lo soporta) o lo descarga como respaldo.
   ============================================================ */
async function capturarElementoComoImagen(elementId, nombreArchivo, textoCompartir){
  const el = document.getElementById(elementId);
  if (!el) { showToast('No se encontró el contenido a capturar.', 3000, true); return; }
  if (!window.html2canvas) { showToast('No se pudo generar la imagen (html2canvas no cargó). Revisa tu conexión.', 4000, true); return; }
  showToast('Generando imagen... 📸');
  /* FIX: refuerzo extra contra imágenes "lavadas"/transparentes —
     se fuerza opacidad 1 inline y se anula cualquier animación en
     curso (como fade-in) antes de capturar, y se espera un frame
     para asegurar que el navegador ya aplicó el estilo. */
  const opacidadOriginal = el.style.opacity;
  const animacionOriginal = el.style.animation;
  el.style.opacity = '1';
  el.style.animation = 'none';
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  try {
    const canvas = await html2canvas(el, { backgroundColor:'#ffffff', scale:2, useCORS:true });
    canvas.toBlob(async (blob) => {
      if (!blob) { showToast('No se pudo generar la imagen.', 3000, true); return; }
      const archivo = new File([blob], nombreArchivo, { type:'image/png' });
      if (navigator.canShare && navigator.canShare({ files:[archivo] })) {
        try {
          await navigator.share({ files:[archivo], title:'AguaTorre', text: textoCompartir || '' });
          return;
        } catch(e){ console.warn('Compartir cancelado, se ofrece descarga:', e); }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = nombreArchivo;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      showToast('Imagen descargada 📥 Compártela por WhatsApp desde tu galería.');
    }, 'image/png');
  } catch(err){
    console.error('Error generando imagen:', err);
    showToast('Error al generar la imagen: ' + (err.message||''), 3000, true);
  } finally {
    // Restaura los estilos originales del contenedor tras la captura
    el.style.opacity = opacidadOriginal;
    el.style.animation = animacionOriginal;
  }
}
</script>
<script>
let CLIENTE_ACTUAL = null;
function irA(ruta){ location.hash = ruta; }
window.addEventListener('hashchange', () => router());

async function router(){
  const hash = location.hash.replace(/^#\/?/, '') || '';
  const partes = hash.split('/').filter(Boolean);

  if (partes[0] === 'admin') {
    if (safeStorage.getItem(ADMIN_SESSION_KEY) !== 'true') {
      showToast('🔒 Acceso restringido: inicia sesión como administrador.');
      irA(''); return;
    }
    const seccion = partes[1] || 'resumen';
    return renderAdmin(seccion);
  }

  if (!hash && safeStorage.getItem(ADMIN_SESSION_KEY) === 'true') {
    return renderAdmin('resumen');
  }

  const clienteId = safeStorage.getItem(LS_KEY);
  if (!clienteId) { return renderLogin(); }

  if (!CLIENTE_ACTUAL || CLIENTE_ACTUAL.id !== clienteId) {
    const { data, error } = await supabaseClient.from('clientes').select('*').eq('id', clienteId).single();
    if (error || !data) { safeStorage.removeItem(LS_KEY); return renderLogin(); }
    CLIENTE_ACTUAL = data;
  }

  const ruta = partes[0] || 'home';
  switch(ruta){
    case 'home': return renderHome(CLIENTE_ACTUAL);
    case 'pedido':
      if (partes[1] === 'nuevo') return renderNuevoPedido(CLIENTE_ACTUAL);
      if (partes[1]) return renderSeguimiento(CLIENTE_ACTUAL, partes[1]);
      return renderHome(CLIENTE_ACTUAL);
    case 'historial': return renderHistorial(CLIENTE_ACTUAL);
    case 'puntos': return renderPuntos(CLIENTE_ACTUAL);
    case 'notificaciones': return renderNotificaciones(CLIENTE_ACTUAL);
    case 'perfil': return renderPerfil(CLIENTE_ACTUAL);
    case 'referidos': return renderReferidos(CLIENTE_ACTUAL);
    default: return renderHome(CLIENTE_ACTUAL);
  }
}

async function recargarClienteActual(){
  if (!CLIENTE_ACTUAL) return null;
  const { data } = await supabaseClient.from('clientes').select('*').eq('id', CLIENTE_ACTUAL.id).single();
  if (data) CLIENTE_ACTUAL = data;
  return CLIENTE_ACTUAL;
}

async function handlePaso1(refCode){
  /* FIX: se normaliza la torre a mayúsculas desde este punto de
     entrada único. Como "torre" fluye hacia renderPaso2Clave,
     renderPaso2Registro y handleRegistro, con normalizar aquí basta
     para que TODO el flujo de login/registro use el valor correcto. */
  const torre = normalizaTorre(document.getElementById('in-torre').value.trim());
  const depto = document.getElementById('in-depto').value.trim();
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('btn-continuar');
  errEl.classList.add('hidden');
  if (!torre || !depto) {
    errEl.textContent = 'Ingresa Torre y Depto para continuar.';
    errEl.classList.remove('hidden');
    return;
  }
  const textoOriginal = btn.textContent;
  btn.disabled = true; btn.textContent = 'Buscando...';
  try {
    const { data: existentes, error } = await supabaseClient
      .from('clientes').select('*').eq('torre', torre).eq('depto', depto).limit(1);
    if (error) throw error;
    if (existentes && existentes.length > 0 && existentes[0].clave) {
      renderPaso2Clave(existentes[0], torre, depto);
    } else if (existentes && existentes.length > 0 && !existentes[0].clave) {
      renderPaso2Registro(torre, depto, refCode, existentes[0]);
    } else {
      renderPaso2Registro(torre, depto, refCode, null);
    }
  } catch (err) {
    console.error('Error buscando depto:', err);
    errEl.textContent = 'Error: ' + (err.message || JSON.stringify(err));
    errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = textoOriginal;
  }
}

async function handleRegistro(torre, depto, refCode, clienteParaReclamar){
  const nombre = document.getElementById('in-nombre').value.trim();
  const apellido = document.getElementById('in-apellido').value.trim();
  const telefono = document.getElementById('in-telefono').value.trim();
  const correo = document.getElementById('in-correo').value.trim();
  const clave = document.getElementById('in-clave').value.trim();
  const errEl = document.getElementById('login-error3');
  const btn = document.getElementById('btn-registrar');
  errEl.classList.add('hidden');
  if (!nombre || !clave) {
    errEl.textContent = 'Completa al menos tu nombre y crea una clave.';
    errEl.classList.remove('hidden');
    return;
  }
  const textoOriginal = btn.textContent;
  btn.disabled = true; btn.textContent = 'Creando cuenta...';
  try {
    let cliente; let esNuevo = false;
    if (clienteParaReclamar) {
      const { data: actualizado, error: errClaim } = await supabaseClient
        .from('clientes').update({ clave, apellido, telefono, correo }).eq('id', clienteParaReclamar.id).select().single();
      if (errClaim) throw errClaim;
      cliente = actualizado;
    } else {
      const codigo_referido = uuidCorto();
      const { data: nuevo, error: errCrea } = await supabaseClient
        .from('clientes')
        .insert({ nombre, apellido, telefono, correo, torre, depto, clave, codigo_referido, bidones_totales:0, puntos:0, puntos_totales:0, racha_actual:0 })
        .select().single();
      if (errCrea) throw errCrea;
      cliente = nuevo;
      esNuevo = true;
    }
    if (esNuevo && refCode) {
      await procesarReferido(refCode, cliente).catch(e=>console.warn('Referido no procesado:', e));
      const { data: clienteActualizado, error: errRefetch } = await supabaseClient
        .from('clientes').select('*').eq('id', cliente.id).single();
      if (!errRefetch && clienteActualizado) cliente = clienteActualizado;
      else logSupabaseError('recargar cliente tras procesar referido', errRefetch);
    }
    safeStorage.setItem(LS_KEY, cliente.id);
    safeStorage.setItem(NOMBRE_KEY, nombre);
    CLIENTE_ACTUAL = cliente;
    location.hash = '#/home';
    router();
  } catch (err) {
    console.error('Error en registro:', err);
    errEl.textContent = 'Error: ' + (err.message || JSON.stringify(err));
    errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = textoOriginal;
  }
}

async function procesarReferido(codigo, clienteNuevo){
  const { data: invitador, error: errBusca } = await supabaseClient.from('clientes').select('*').eq('codigo_referido', codigo).limit(1).single();
  if (logSupabaseError('buscar invitador por código de referido', errBusca)) return;
  if (!invitador || invitador.id === clienteNuevo.id) return;

  const { error: errInsert } = await supabaseClient.from('referidos').insert({
    cliente_invitador_id: invitador.id, cliente_invitado_id: clienteNuevo.id, puntos_otorgados: PUNTOS_POR_REFERIDO_INVITADOR
  });
  logSupabaseError('insertar registro de referido', errInsert);

  const { error: errInvitador } = await supabaseClient.from('clientes').update({
    puntos: (invitador.puntos||0) + PUNTOS_POR_REFERIDO_INVITADOR,
    puntos_totales: puntosTotalesDe(invitador) + PUNTOS_POR_REFERIDO_INVITADOR
  }).eq('id', invitador.id);
  logSupabaseError('sumar puntos al invitador', errInvitador);

  const { error: errInvitado } = await supabaseClient.from('clientes').update({
    puntos: (clienteNuevo.puntos||0) + PUNTOS_POR_REFERIDO_INVITADO,
    puntos_totales: puntosTotalesDe(clienteNuevo) + PUNTOS_POR_REFERIDO_INVITADO
  }).eq('id', clienteNuevo.id);
  logSupabaseError('sumar puntos al cliente nuevo (invitado)', errInvitado);

  await crearNotificacion(invitador.id, 'referido', `🤝 ¡${clienteNuevo.nombre} se unió con tu código! Ganaste ${PUNTOS_POR_REFERIDO_INVITADOR} puntos.`);
  await crearNotificacion(clienteNuevo.id, 'referido', `🎉 ¡Bienvenido! Ganaste ${PUNTOS_POR_REFERIDO_INVITADO} puntos por unirte con una invitación.`);
}

function handleAdminAccess(){
  const pin = prompt('Ingresa el PIN de administrador:');
  if (pin === ADMIN_PIN) {
    safeStorage.setItem(ADMIN_SESSION_KEY, 'true');
    location.hash = '#/admin';
    router();
  } else if (pin !== null) {
    showToast('❌ PIN incorrecto.');
  }
}
</script>

        </div>
        <p class="text-sm text-slate-500 mb-3">Pedido #${ultimo.id.toString().slice(0,8).toUpperCase()} · ${ultimo.total ? clp(ultimo.total) : (ultimo.cantidad + ' bidón(es) ' + ultimo.tipo_bidon)}</p>
        ${estado !== 'entregado' && estado !== 'cancelado' ? `<a href="#/pedido/${ultimo.id}" class="block text-center btn-primary py-2.5">Ver seguimiento 🚚</a>` : `<a href="#/pedido/${ultimo.id}" class="block text-center btn-ghost py-2.5 font-semibold">Ver detalle</a>`}

  document.getElementById('home-content').innerHTML = `
    <div class="fade-in flex justify-between items-start pt-2 mb-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">¡Hola, ${miNombre}! 👋</h1>
        <p class="text-slate-500 text-sm">Torre ${normalizaTorre(cliente.torre)} · Depto ${cliente.depto}</p>
      </div>
      <a href="#/notificaciones" class="w-10 h-10 flex items-center justify-center rounded-full bg-white shadow text-lg relative">🔔</a>
    </div>

    <div class="card p-5 mb-4 fade-in bg-gradient-to-br ${nivel.actual.color} text-white" style="background:linear-gradient(135deg,#0ea5e9,#0369a1)">
      <div class="flex justify-between items-center mb-1">
        <span class="font-bold">Tu nivel</span>
        <span class="text-2xl">${nivel.actual.emoji}</span>
      </div>
      <p class="text-lg font-extrabold mb-2">${nivel.actual.nombre}</p>
      <div class="progress-track h-3 bg-white/30">
        <div class="h-3 rounded-full bg-white" style="width:${nivel.pct}%"></div>
      </div>
      <p class="text-xs mt-2 opacity-90">${nivel.puntos} ${nivel.siguiente ? '/ ' + nivel.tope : ''} pts acumulados ${nivel.siguiente ? '· Te faltan ' + nivel.faltan + ' para ' + nivel.siguiente.nombre : '· ¡Nivel máximo alcanzado!'}</p>
    </div>

    <div class="card p-5 mb-4 fade-in">
      <h2 class="font-bold text-slate-700 mb-3">Tus estadísticas</h2>
      <div class="grid grid-cols-3 gap-2 text-center">
        <div><p class="text-xl font-extrabold text-sky-600">${totalPedidos}</p><p class="text-[11px] text-slate-500">Pedidos</p></div>
        <div><p class="text-xl font-extrabold text-sky-600">${cliente.puntos||0}</p><p class="text-[11px] text-slate-500">Puntos disp.</p></div>
        <div><p class="text-xl font-extrabold text-orange-500">🔥 ${cliente.racha_actual||0}</p><p class="text-[11px] text-slate-500">Racha (días)</p></div>

    <a href="#/pedido/nuevo" class="hidden md:block text-center btn-primary py-4 mb-4 text-lg">💧 HACER PEDIDO</a>

      <a href="#/puntos" class="card py-3 flex flex-col items-center gap-1 text-xs font-semibold text-slate-600">⭐ Puntos</a>

function skeletonHome(){

<script>
let PEDIDO_WIZ = { paso:1, depto: null, torre: null, horario:'hoy', fecha_programada:'', indicaciones:'', pago:'efectivo' };
let BUSQUEDA_PRODUCTOS = '';

async function renderNuevoPedido(cliente){
  PEDIDO_WIZ = { paso:1, torre: normalizaTorre(cliente.torre), depto: cliente.depto, horario:'hoy', fecha_programada:'', indicaciones:'', pago:'efectivo' };
  BUSQUEDA_PRODUCTOS = '';
  app.innerHTML = `${headerSecundario('Hacer pedido', '#/home')}<div id="ped-wrap" class="px-4">${skeletonHome()}</div>`;
  await cargarCatalogoProductos();
  pintarPasoPedido(cliente);
}

function pintarPasoPedido(cliente){
  const w = PEDIDO_WIZ;
  const carrito = obtenerCarrito();
  const total = totalCarrito(carrito);
  const cantidadItems = cantidadTotalCarrito(carrito);
  const pasos = ['¿Qué necesitas?','¿Dónde lo entregamos?','¿Cuándo lo quieres?','Indicaciones'];
  /* FIX: horario dinámico según el día (entresemana vs fin de semana) */
  const horarioHoy = horarioEntregaHoy();

  let contenido = '';
  if (w.paso === 1) {
    const filtro = BUSQUEDA_PRODUCTOS.trim().toLowerCase();
    const productosFiltrados = CATALOGO_PRODUCTOS.filter(p => !filtro || p.nombre.toLowerCase().includes(filtro) || (p.categoria||'').toLowerCase().includes(filtro));
    const categorias = [...new Set(productosFiltrados.map(p=>p.categoria||'Otros'))];

    contenido = `
      <div class="mb-3">
        <input id="in-buscar-producto" type="text" placeholder="🔎 Buscar producto..." value="${BUSQUEDA_PRODUCTOS}"
          class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-sky-400">
      </div>
      <div id="lista-productos">
        ${productosFiltrados.length === 0 ? emptyState('🔎','No encontramos productos','Prueba con otro término de búsqueda.') :
          categorias.map(cat => `
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wide mt-4 mb-2">${cat}</p>
            <div class="space-y-2">
              ${productosFiltrados.filter(p=>(p.categoria||'Otros')===cat).map(p => {
                const cant = cantidadEnCarrito(p.id);
                return `
                <div class="card p-3 flex items-center gap-3">
                  <div class="w-11 h-11 rounded-xl bg-sky-50 flex items-center justify-center text-xl shrink-0">${p.emoji || '💧'}</div>
                  <div class="flex-1 min-w-0">
                    <p class="font-semibold text-slate-700 text-sm truncate">${p.nombre}</p>
                    <p class="text-xs text-slate-500">${clp(p.precio)}</p>
                  </div>
                  ${cant === 0 ? `
                    <button data-pid="${p.id}" class="btn-add-carrito btn-primary text-sm px-4 py-2 shrink-0">Agregar</button>
                  ` : `
                    <div class="flex items-center gap-2 shrink-0">
                      <button data-pid="${p.id}" data-delta="-1" class="btn-cart-delta stepper-btn bg-slate-100 text-slate-600">−</button>
                      <span class="w-6 text-center font-bold">${cant}</span>
                      <button data-pid="${p.id}" data-delta="1" class="btn-cart-delta stepper-btn bg-sky-100 text-sky-700">+</button>
                    </div>
                  `}
                </div>`;
              }).join('')}
            </div>
          `).join('')
        }
      </div>
      ${cantidadItems > 0 ? `
        <div class="card p-4 mt-4 sticky bottom-20 md:bottom-4 fade-in" style="border:2px solid #bae6fd;">
          <div class="flex justify-between items-center text-sm mb-1">
            <span class="text-slate-500">${cantidadItems} producto(s) en tu carrito</span>
            <span class="font-extrabold text-sky-700 text-base">${clp(total)}</span>
          </div>
        </div>` : ''}
    `;
  } else if (w.paso === 2) {
    contenido = `
      <div class="card p-5 fade-in">
        <p class="text-sm text-slate-500 mb-3">Entregamos en tu dirección registrada. Puedes ajustarla si es necesario.</p>
        <div class="flex gap-3">
          <input id="in-torre-p" value="${w.torre}" placeholder="Torre" class="w-1/2 border rounded-xl px-4 py-3">
          <input id="in-depto-p" value="${w.depto}" placeholder="Depto" class="w-1/2 border rounded-xl px-4 py-3">
        </div>
      </div>`;
  } else if (w.paso === 3) {
    /* FIX: opción "Hoy" ahora muestra el horario dinámico correcto
       según si es día de semana (18-22) o fin de semana (hasta 22). */
    const opciones = [
      { v:'hoy', label:`Hoy, ${horarioHoy.textoLargo}`, icon: horarioHoy.esFinde ? '🌤️' : '🕕' },
      { v:'programado', label:'Programar entrega', icon:'🗓️' },
    ];
    contenido = `
      <div class="card p-5 fade-in space-y-2">
        ${opciones.map(o => `
          <button data-horario="${o.v}" class="btn-horario w-full flex items-center gap-3 text-left rounded-xl px-4 py-3 border ${w.horario===o.v?'border-sky-500 bg-sky-50':'border-slate-200'}">
            <span class="text-xl">${o.icon}</span><span class="font-semibold text-slate-700">${o.label}</span>
          </button>`).join('')}
        ${w.horario==='hoy' ? `<p class="text-xs text-slate-400 px-1 pt-1">${horarioHoy.esFinde ? 'Los fines de semana entregamos en cualquier horario, hasta las ' + HORA_FIN_ENTREGA + ' hrs.' : 'De lunes a viernes entregamos entre las ' + HORA_INICIO_ENTREGA_SEMANA + ' y las ' + HORA_FIN_ENTREGA + ' hrs.'}</p>` : ''}
        ${w.horario==='programado' ? `<input id="in-fecha-prog" type="datetime-local" value="${w.fecha_programada}" class="w-full border rounded-xl px-4 py-3 mt-2">` : ''}
      </div>`;
  } else if (w.paso === 4) {
    const filas = carrito.map(it => `
      <div class="flex justify-between text-sm"><span>${it.cantidad} × ${it.nombre}</span><b>${clp(it.precio * it.cantidad)}</b></div>
    `).join('');
    const datosBancariosHtml = w.pago === 'transferencia' ? `
      <div class="bg-sky-50 border border-sky-200 rounded-xl p-4 mt-3 text-sm text-slate-700 space-y-1">
        <p class="font-bold text-sky-700 mb-1">🏦 Datos para transferencia</p>
        <div class="flex justify-between"><span>Banco</span><b>${DATOS_BANCARIOS.banco}</b></div>
        <div class="flex justify-between"><span>Tipo de cuenta</span><b>${DATOS_BANCARIOS.tipoCuenta}</b></div>
        <div class="flex justify-between"><span>N° de cuenta</span><b>${DATOS_BANCARIOS.numeroCuenta}</b></div>
        <div class="flex justify-between"><span>RUT</span><b>${DATOS_BANCARIOS.rut}</b></div>
        <div class="flex justify-between"><span>Correo</span><b>${DATOS_BANCARIOS.correo}</b></div>
        <div class="flex justify-between"><span>Teléfono</span><b>${DATOS_BANCARIOS.telefono}</b></div>
        <p class="text-xs text-slate-400 pt-1">Envía el comprobante al confirmar tu pedido.</p>
      </div>` : '';
    contenido = `
      <div class="card p-5 fade-in mb-4">
        <label class="text-sm font-semibold text-slate-600 mb-2 block">Indicaciones (opcional)</label>
        <textarea id="in-indicaciones" rows="3" placeholder="Ej: dejar en conserjería." class="w-full border rounded-xl px-4 py-3">${w.indicaciones}</textarea>
        <label class="text-sm font-semibold text-slate-600 mt-3 mb-2 block">Método de pago</label>
        <select id="in-pago" class="w-full border rounded-xl px-4 py-3">
          <option value="efectivo" ${w.pago==='efectivo'?'selected':''}>Pago en efectivo</option>
          <option value="transferencia" ${w.pago==='transferencia'?'selected':''}>Pago por transferencia</option>
        </select>
        ${datosBancariosHtml}
      </div>
      <div class="card p-5 fade-in">
        <h3 class="font-bold text-slate-700 mb-3">Resumen del pedido</h3>
        <div class="space-y-1.5 text-sm text-slate-600">
          ${filas}
          <div class="flex justify-between"><span>Dirección</span><b>Torre ${w.torre} · Depto ${w.depto}</b></div>
          <div class="flex justify-between"><span>Horario</span><b>${w.horario==='hoy'?`Hoy, ${horarioHoy.textoCorto}`:'Programado'}</b></div>
          <div class="flex justify-between border-t pt-2 mt-2 text-base"><span class="font-bold">Total</span><b class="text-sky-700">${clp(total)}</b></div>
        </div>
      </div>`;
  }

  const puedeContinuar = w.paso !== 1 || cantidadItems > 0;

  document.getElementById('ped-wrap').innerHTML = `
    <div class="flex justify-center mb-2">${mascotaImg('pedido', 72)}</div>
    <div class="flex items-center gap-1 mb-4">
      ${[1,2,3,4].map(p => `<div class="h-1.5 flex-1 rounded-full ${p<=w.paso?'bg-sky-500':'bg-slate-200'}"></div>`).join('')}
    </div>
    <p class="text-xs font-semibold text-sky-600 mb-1">Paso ${w.paso} de 4</p>
    <h2 class="text-lg font-bold text-slate-800 mb-3">${pasos[w.paso-1]}</h2>
    ${contenido}
    <div class="flex gap-3 mt-5 pb-8">
      ${w.paso>1 ? `<button id="btn-atras" class="btn-ghost flex-1 py-3 font-semibold">Atrás</button>` : ''}
      <button id="btn-siguiente" ${puedeContinuar?'':'disabled'} class="btn-primary flex-1 py-3">${w.paso<4 ? 'Continuar' : 'Confirmar pedido 💧'}</button>
    </div>
  `;

  if (w.paso===1){
    const inputBuscar = document.getElementById('in-buscar-producto');
    inputBuscar.addEventListener('input', ()=>{ BUSQUEDA_PRODUCTOS = inputBuscar.value; pintarPasoPedido(cliente); });
    inputBuscar.focus(); inputBuscar.setSelectionRange(inputBuscar.value.length, inputBuscar.value.length);
    document.querySelectorAll('.btn-add-carrito').forEach(b => b.addEventListener('click', ()=>{
      const p = productoPorId(b.getAttribute('data-pid'));
      if (p) agregarAlCarrito(p, 1);
      pintarPasoPedido(cliente);
    }));
    document.querySelectorAll('.btn-cart-delta').forEach(b => b.addEventListener('click', ()=>{
      const p = productoPorId(b.getAttribute('data-pid'));
      const delta = parseInt(b.getAttribute('data-delta'),10);
      if (p) agregarAlCarrito(p, delta);
      pintarPasoPedido(cliente);
    }));
  }
  if (w.paso===3){
    document.querySelectorAll('.btn-horario').forEach(b => b.addEventListener('click', ()=>{ w.horario = b.getAttribute('data-horario'); pintarPasoPedido(cliente); }));
  }
  if (w.paso===4){
    document.getElementById('in-pago').addEventListener('change', (e)=>{
      w.indicaciones = document.getElementById('in-indicaciones').value.trim();
      w.pago = e.target.value;
      pintarPasoPedido(cliente);
    });
  }
  if (w.paso>1) document.getElementById('btn-atras').addEventListener('click', ()=>{ guardarPasoActual(); w.paso--; pintarPasoPedido(cliente); });
  document.getElementById('btn-siguiente').addEventListener('click', async ()=>{
    if (w.paso === 1 && cantidadTotalCarrito(obtenerCarrito()) === 0) { showToast('Agrega al menos un producto al carrito 💧'); return; }
    guardarPasoActual();
    if (w.paso < 4) { w.paso++; pintarPasoPedido(cliente); }
    else { await confirmarPedido(cliente); }
  });

  function guardarPasoActual(){
    if (w.paso===2){ w.torre = normalizaTorre(document.getElementById('in-torre-p').value.trim()) || w.torre; w.depto = document.getElementById('in-depto-p').value.trim() || w.depto; }
    if (w.paso===3 && w.horario==='programado'){ const el=document.getElementById('in-fecha-prog'); if (el) w.fecha_programada = el.value; }
    if (w.paso===4){ w.indicaciones = document.getElementById('in-indicaciones').value.trim(); w.pago = document.getElementById('in-pago').value; }
  }
}

async function confirmarPedido(cliente){
  const w = PEDIDO_WIZ;
  const btn = document.getElementById('btn-siguiente');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    const carrito = obtenerCarrito();
    if (carrito.length === 0) throw new Error('Tu carrito está vacío.');
    const total = totalCarrito(carrito);
    const cantidadTotal = cantidadTotalCarrito(carrito);
    const miNombre = safeStorage.getItem(NOMBRE_KEY) || cliente.nombre;
    const primerItem = carrito[0];

    const { data: pedidoCreado, error: errPedido } = await supabaseClient.from('pedidos').insert({
      cliente_id: cliente.id,
      cantidad: cantidadTotal,
      tipo_bidon: carrito.length > 1 ? `${primerItem.nombre} +${carrito.length-1} más` : primerItem.nombre,
      metodo_pago: w.pago,
      estado: 'solicitado',
      nombre_solicitante: miNombre,
      horario_tipo: w.horario,
      fecha_programada: w.horario==='programado' && w.fecha_programada ? w.fecha_programada : null,
      indicaciones: w.indicaciones || null,
      precio_unitario: primerItem.precio,
      total: total
    }).select().single();
    if (errPedido) throw errPedido;

    let itemsGuardados = false;
    try {
      const filas = carrito.map(it => ({
        pedido_id: pedidoCreado.id,
        producto_id: String(it.producto_id).startsWith('legado-') ? null : it.producto_id,
        nombre_producto: it.nombre,
        cantidad: it.cantidad,
        precio_unitario: it.precio,
        subtotal: it.precio * it.cantidad
      }));
      const { error: errItems } = await supabaseClient.from('pedido_items').insert(filas);
      if (errItems) {
        logSupabaseError('guardar pedido_items', errItems);
        showToast('⚠️ Pedido creado, pero no se pudo guardar el detalle del carrito. Detalle: ' + errItems.message, 5000, true);
      } else {
        itemsGuardados = true;
      }
    } catch(e){
      console.error('Excepción guardando pedido_items:', e);
      showToast('⚠️ Pedido creado, pero hubo un error guardando el detalle del carrito.', 5000, true);
    }

    const nivelActualIdx = infoNivel(puntosTotalesDe(cliente)).idx;
    const ganancia = conBonusNivel(cantidadTotal * PUNTOS_POR_BIDON, nivelActualIdx);
    const nuevoTotalBidones = (cliente.bidones_totales||0) + cantidadTotal;
    let nuevaRacha = cliente.racha_actual || 0;
    const hoy = hoyStr();
    if (cliente.ultima_fecha_pedido === hoy) { /* ya cuenta hoy, no cambia */ }
    else if (cliente.ultima_fecha_pedido === ayerStr()) { nuevaRacha = nuevaRacha + 1; }
    else { nuevaRacha = 1; }
    const puntosRacha = (cliente.ultima_fecha_pedido !== hoy) ? conBonusNivel(PUNTOS_POR_RACHA_DIA, nivelActualIdx) : 0;
    const gananciaTotal = ganancia + puntosRacha;
    const nuevoPuntos = (cliente.puntos||0) + gananciaTotal;
    const nuevoPuntosTotales = puntosTotalesDe(cliente) + gananciaTotal;

    const nivelAntes = infoNivel(puntosTotalesDe(cliente)).actual.nombre;
    const nivelDespues = infoNivel(nuevoPuntosTotales).actual.nombre;

    const { error: errCliente } = await supabaseClient.from('clientes').update({
      bidones_totales: nuevoTotalBidones, puntos: nuevoPuntos, puntos_totales: nuevoPuntosTotales,
      racha_actual: nuevaRacha, ultima_fecha_pedido: hoy
    }).eq('id', cliente.id);
    logSupabaseError('actualizar puntos del cliente', errCliente);

    await crearNotificacion(cliente.id, 'pedido', `📝 Tu pedido #${pedidoCreado.id.toString().slice(0,8).toUpperCase()} fue recibido. ¡Ganaste ${gananciaTotal} puntos!`);
    const subioDeNivel = nivelAntes !== nivelDespues;
    if (subioDeNivel) await crearNotificacion(cliente.id, 'nivel', `🎉 ¡Subiste de nivel! Ahora eres ${nivelDespues}.`);

    vaciarCarrito();
    await recargarClienteActual();
    lanzarConfeti('💧', 16);
    if (itemsGuardados) showToast('¡Pedido recibido! 💧');

    /* NUEVO: si el cliente subió de nivel con este pedido, se muestra
       un modal de celebración con la mascota "nivel" (corona+trofeo)
       antes de continuar al seguimiento, para reforzar el logro. */
    if (subioDeNivel) {
      mostrarModalNivel(nivelDespues, () => { location.hash = `#/pedido/${pedidoCreado.id}`; router(); });
    } else {
      location.hash = `#/pedido/${pedidoCreado.id}`;
      router();
    }
  } catch (err) {
    console.error('Error al crear pedido:', err);
    showToast('Error al enviar el pedido: ' + (err.message || JSON.stringify(err)), 3000, true);
    btn.disabled = false; btn.textContent = 'Confirmar pedido 💧';
  }
}
</script>
<script>
async function renderSeguimiento(cliente, pedidoId){
  app.innerHTML = shellCliente(`${headerSecundario('Seguimiento','#/home')}<div id="seg-content" class="px-0">${skeletonHome()}</div>`, 'home');
  const { data: pedido, error } = await supabaseClient.from('pedidos').select('*, repartidores(*)').eq('id', pedidoId).single();
  const cont = document.getElementById('seg-content');
  if (error || !pedido) { cont.innerHTML = emptyState('❓','No encontramos ese pedido',''); return; }
  let items = [];
  try { const { data, error: errI } = await supabaseClient.from('pedido_items').select('*').eq('pedido_id', pedidoId); logSupabaseError('leer pedido_items', errI); items = data || []; }
  catch(e){ console.warn('Tabla pedido_items no disponible aún.'); }

  const estado = normalizaEstado(pedido.estado);
  const pasos = ['solicitado','entregado'];
  const idxActual = pasos.indexOf(estado);

  const timeline = pasos.map((p, i) => {
    const labels = { solicitado:'Pedido solicitado', entregado:'Entregado' };
    const hecho = estado==='cancelado' ? false : i <= idxActual;
    const esActual = i === idxActual && estado!=='cancelado';
    return `
      <div class="flex items-center gap-3">
        <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs ${hecho?'bg-sky-500 text-white':'bg-slate-200 text-slate-400'} ${esActual?'ring-4 ring-sky-100':''}">${hecho?'✓':'○'}</div>
        <span class="text-sm ${hecho?'text-slate-700 font-semibold':'text-slate-400'}">${labels[p]}</span>
      </div>
      ${i<pasos.length-1?'<div class="ml-3 border-l-2 border-slate-200 h-5"></div>':''}
    `;
  }).join('');

  let repartidorHtml = '';
  if (pedido.repartidores) {
    const r = pedido.repartidores;
    repartidorHtml = `
      <div class="card p-4 mb-4 flex items-center gap-3">
        <div class="w-12 h-12 rounded-full bg-sky-100 flex items-center justify-center text-xl overflow-hidden">${r.foto_url ? `<img src="${r.foto_url}" class="w-full h-full object-cover">` : '🚴'}</div>
        <div class="flex-1">
          <p class="font-bold text-slate-700">${r.nombre}</p>
          <p class="text-xs text-slate-500">⭐ ${(r.calificacion||5).toFixed(1)}</p>
        </div>
        ${r.telefono ? `<a href="tel:${r.telefono}" class="w-10 h-10 rounded-full bg-green-100 text-green-700 flex items-center justify-center">📞</a>` : ''}
      </div>`;
  }

  const detalleProductos = items.length > 0
    ? items.map(it => `<div class="flex justify-between"><span>${it.cantidad} × ${it.nombre_producto}</span><b>${clp(it.subtotal)}</b></div>`).join('')
    : `<div class="flex justify-between"><span>Cantidad</span><b>${pedido.cantidad} × ${pedido.tipo_bidon}</b></div>`;

  /* FIX: mensaje de horario dinámico según el día en que se creó el
     pedido (usa el mismo helper que el wizard de pedido). */
  const horarioMsg = horarioEntregaHoy();
  /* NUEVO: mascota dinámica según el estado del pedido — con el
     bidón mientras va en camino, con la capa "ENTREGADO" cuando ya
     se entregó, para reforzar visualmente cada momento del cliente. */
  const mascotaVariante = estado === 'entregado' ? 'entregado' : 'pedido';
  cont.innerHTML = `
    <div class="px-4">
      <div class="flex justify-center mb-3 fade-in">${mascotaImg(mascotaVariante, 110)}</div>
      <div class="card p-5 mb-4 fade-in">
        <div class="flex justify-between items-start mb-3">
          <div>
            <p class="text-xs text-slate-400">Pedido</p>
            <p class="font-bold text-slate-800">#${pedido.id.toString().slice(0,8).toUpperCase()}</p>
          </div>
          <span class="px-3 py-1.5 rounded-full text-xs font-bold ${estadoColor(pedido.estado)}">${estadoLabel(pedido.estado)}</span>
        </div>
        ${estado==='solicitado' && pedido.horario_tipo==='hoy' ? `<div class="bg-sky-50 text-sky-700 text-sm rounded-xl px-4 py-2 mb-3">🕕 Tu pedido llega hoy, ${horarioMsg.textoLargo}.</div>` : ''}
        ${estado==='solicitado' && pedido.horario_tipo==='programado' && pedido.fecha_programada ? `<div class="bg-sky-50 text-sky-700 text-sm rounded-xl px-4 py-2 mb-3">🗓️ Entrega programada para <b>${fechaHora(pedido.fecha_programada)}</b>.</div>` : ''}
        ${estado==='cancelado' ? `<div class="bg-red-50 text-red-600 text-sm rounded-xl px-4 py-2 mb-3">Este pedido fue cancelado.</div>` : `<div class="space-y-1">${timeline}</div>`}
      </div>
      ${repartidorHtml}
      <div class="card p-5 mb-6 fade-in">
        <h3 class="font-bold text-slate-700 mb-2">Detalle</h3>
        <div class="space-y-1.5 text-sm text-slate-600">
          ${detalleProductos}
          <div class="flex justify-between border-t pt-2 mt-2"><span class="font-bold">Total</span><b class="text-sky-700">${clp(pedido.total || (PRECIOS_BIDON[pedido.tipo_bidon]||0)*pedido.cantidad)}</b></div>
          <div class="flex justify-between"><span>Fecha</span><b>${fechaHora(pedido.created_at)}</b></div>
          ${pedido.indicaciones ? `<div class="flex justify-between"><span>Indicaciones</span><b>${pedido.indicaciones}</b></div>` : ''}
        </div>
      </div>
    </div>
  `;
}

let FILTRO_HISTORIAL = 'todos';
async function renderHistorial(cliente){
  app.innerHTML = shellCliente(`${headerSecundario('Mis pedidos','#/home')}<div id="hist-content" class="px-4">${skeletonHome()}</div>`, 'historial');
  const { data: pedidos } = await supabaseClient.from('pedidos').select('*').eq('cliente_id', cliente.id).order('created_at', { ascending:false });
  pintarHistorial(pedidos || []);
}
function pintarHistorial(pedidos){
  const filtros = [
    { id:'todos', label:'Todos' },
    { id:'solicitado', label:'Solicitados' },
    { id:'entregado', label:'Entregados' },
    { id:'cancelado', label:'Cancelados' },
  ];
  const filtrados = FILTRO_HISTORIAL==='todos' ? pedidos : pedidos.filter(p => normalizaEstado(p.estado) === FILTRO_HISTORIAL);

  const lista = filtrados.length>0 ? filtrados.map(p => `
    <a href="#/pedido/${p.id}" class="card p-4 mb-3 flex justify-between items-center block">
      <div>
        <p class="font-semibold text-slate-700 text-sm">#${p.id.toString().slice(0,8).toUpperCase()} · ${p.cantidad} ítem(s)</p>
        <p class="text-xs text-slate-400">${fechaHora(p.created_at)} · ${clp(p.total || (PRECIOS_BIDON[p.tipo_bidon]||0)*p.cantidad)}</p>
      </div>
      <span class="px-2 py-1 rounded-full text-xs font-semibold ${estadoColor(p.estado)}">${estadoLabel(p.estado)}</span>
    </a>`).join('') : emptyState('📦','No hay pedidos en esta categoría','Prueba con otro filtro.');

  document.getElementById('hist-content').innerHTML = `
    <div class="flex gap-2 mb-4 overflow-x-auto pb-1">
      ${filtros.map(f => `<button data-f="${f.id}" class="btn-filtro whitespace-nowrap px-4 py-2 rounded-full text-sm font-semibold ${FILTRO_HISTORIAL===f.id?'bg-sky-600 text-white':'bg-white text-slate-500 border'}">${f.label}</button>`).join('')}
    </div>
    ${lista}
  `;
  document.querySelectorAll('.btn-filtro').forEach(b => b.addEventListener('click', ()=>{ FILTRO_HISTORIAL = b.getAttribute('data-f'); pintarHistorial(pedidos); }));
}
</script>
<script>
async function renderPuntos(cliente){
  app.innerHTML = shellCliente(`${headerSecundario('Puntos y niveles','#/home')}<div id="pts-content" class="px-4">${skeletonHome()}</div>`, 'puntos');
  const nivel = infoNivel(puntosTotalesDe(cliente));
  let recompensas = [];
  try { const { data } = await supabaseClient.from('recompensas').select('*').eq('activa', true).order('costo_puntos', { ascending:true }); recompensas = data || []; }
  catch(e){ console.warn('Tabla recompensas no disponible aún.'); }

  let misCanjes = [];
  try { const { data } = await supabaseClient.from('canjes').select('*, recompensas(nombre, tipo, costo_puntos)').eq('cliente_id', cliente.id).order('created_at', { ascending:false }); misCanjes = data || []; }
  catch(e){ console.warn('Tabla canjes no disponible aún.'); }

        <p class="font-bold text-slate-700 text-sm">${iconoRecompensa(r.tipo)} ${r.nombre}</p>

  document.getElementById('pts-content').innerHTML = `
    <div class="card p-5 mb-4 text-center fade-in" style="background:linear-gradient(135deg,#0ea5e9,#0369a1)">
      <div class="flex justify-center mb-1">${mascotaImg(puntosTotalesDe(cliente)>=4000?'nivel':'base', 90)}</div>

      <p class="text-2xl font-extrabold text-white">${nivel.actual.emoji} ${nivel.actual.nombre}</p>
      <div class="progress-track h-3 bg-white/30 mt-3"><div class="h-3 rounded-full bg-white" style="width:${nivel.pct}%"></div></div>
      <p class="text-xs text-white/90 mt-2">${nivel.puntos} pts acumulados ${nivel.siguiente ? '· faltan ' + nivel.faltan + ' pts para ' + nivel.siguiente.nombre : '· ¡nivel máximo!'}</p>
      <p class="text-xs text-white/80 mt-1">💰 Saldo disponible para canjear: <b>${cliente.puntos||0} pts</b></p>
    </div>

    <div class="card p-5 mb-4 fade-in bg-sky-50 border border-sky-200">
      <p class="text-xs text-slate-500 leading-relaxed">
        <b>ℹ️ ¿Cómo funciona?</b> Tu <b>nivel</b> se calcula con todos los puntos que has ganado en tu historia (nunca baja).
        Tu <b>saldo canjeable</b> es lo que puedes gastar en recompensas y sí baja al canjear — pero tu nivel se mantiene igual. 🎉
      </p>
    </div>

    <div class="card p-5 mb-4 fade-in">
      <h3 class="font-bold text-slate-700 mb-2">Escala de niveles</h3>
      <div class="space-y-2">
        ${NIVELES.map((n,i) => `<div class="flex justify-between text-sm ${n.nombre===nivel.actual.nombre?'font-bold text-sky-700':'text-slate-500'}"><span>${n.emoji} ${n.nombre}</span><span>${n.min}+ pts ${MULTIPLICADOR_POR_NIVEL[i]>1 ? `· +${Math.round((MULTIPLICADOR_POR_NIVEL[i]-1)*100)}% pts` : ''}</span></div>`).join('')}
      </div>
    </div>

    <div class="card p-5 mb-4 fade-in">
      <h3 class="font-bold text-slate-700 mb-2">Cómo ganar puntos</h3>

        <li>💧 Hacer un pedido: +${PUNTOS_POR_BIDON} pts por unidad comprada</li>
        <li>🔥 Mantener tu racha activa: +${PUNTOS_POR_RACHA_DIA} pts extra por día</li>
        <li>🤝 Recomendar un vecino: +${PUNTOS_POR_REFERIDO_INVITADOR} pts</li>
        <li>🎉 Participar en promociones y desafíos especiales</li>
        <li>⭐ Bono por nivel: mientras más alto tu nivel, más puntos ganas por cada acción</li>
      </ul>
    </div>

    <div class="mb-6">
      <div class="flex items-center gap-2 mb-2 px-1">
        ${mascotaImg('recompensa', 36)}
        <h3 class="font-bold text-slate-700">Recompensas</h3>
      </div>
      ${recompensasHtml}
    </div>

    ${misCanjes.length > 0 ? `
    <div class="mb-6">
      <h3 class="font-bold text-slate-700 mb-2 px-1">Mis canjes</h3>
      ${misCanjes.map(c => {
        const estadoInfo = {
          pendiente: { label:'⏳ Pendiente', color:'bg-amber-100 text-amber-700' },
          entregado: { label:'✅ Entregado', color:'bg-green-100 text-green-700' },
          cancelado: { label:'❌ Cancelado', color:'bg-red-100 text-red-700' }
        }[c.estado] || { label:c.estado, color:'bg-slate-100 text-slate-600' };
        return `
        <div class="card p-4 mb-3 flex items-center justify-between">
          <div>
            <p class="font-semibold text-slate-700 text-sm">${iconoRecompensa(c.recompensas?.tipo)} ${c.recompensas?.nombre||'Recompensa'}</p>

        </div>`;
      }).join('')}

  document.querySelectorAll('.btn-canjear').forEach(b => b.addEventListener('click', async ()=>{

      const { error: e1 } = await supabaseClient.from('canjes').insert({ cliente_id: cliente.id, recompensa_id: b.getAttribute('data-id'), estado:'pendiente' });

      await crearNotificacion(cliente.id, 'recompensa', '🎁 ¡Recompensa desbloqueada! Un administrador la validará pronto.');

<script>
async function renderAdminResumen(){
  const cont = document.getElementById('admin-content');
  const [{ data: pedidos }, { data: clientes }] = await Promise.all([
    supabaseClient.from('pedidos').select('*').order('created_at', { ascending:false }).limit(1000),
    supabaseClient.from('clientes').select('*')
  ]);
  const listaPedidos = pedidos || [];
  const listaClientes = clientes || [];
  const hoy = hoyStr();
  const pedidosHoy = listaPedidos.filter(p => (p.created_at||'').slice(0,10) === hoy);
  const ventasHoy = pedidosHoy.reduce((a,p)=>a+(p.total || (PRECIOS_BIDON[p.tipo_bidon]||0)*p.cantidad),0);
  const bidonesHoy = pedidosHoy.reduce((a,p)=>a+(p.cantidad||0),0);
  const pendientes = listaPedidos.filter(p => !['entregado','cancelado'].includes(normalizaEstado(p.estado))).length;
  const entregadosTotal = listaPedidos.filter(p => normalizaEstado(p.estado)==='entregado').length;
  const entregasATiempo = entregadosTotal>0 ? Math.round((listaPedidos.filter(p=>normalizaEstado(p.estado)==='entregado' && p.hora_entrega).length / entregadosTotal)*100) : 0;
  const clientesActivos = listaClientes.filter(c => (c.bidones_totales||0) > 0).length;

  const cards = [
    { label:'Pedidos de hoy', valor: pedidosHoy.length, icon:'📦' },
    { label:'Ventas de hoy', valor: clp(ventasHoy), icon:'💰' },
    { label:'Unidades vendidas hoy', valor: bidonesHoy, icon:'💧' },
    { label:'Clientes activos', valor: clientesActivos, icon:'👥' },
    { label:'Pedidos pendientes', valor: pendientes, icon:'⏳' },
    { label:'Entregas a tiempo', valor: entregasATiempo + '%', icon:'✅' },
  ];

  cont.innerHTML = `
    <h1 class="text-2xl font-bold text-slate-800 mb-1 fade-in">Resumen general</h1>
    <p class="text-slate-500 text-sm mb-6">Datos en tiempo real desde Supabase.</p>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6">
      ${cards.map(c => `<div class="card p-4 fade-in"><div class="text-xl mb-1">${c.icon}</div><p class="text-2xl font-extrabold text-slate-800">${c.valor}</p><p class="text-xs text-slate-500">${c.label}</p></div>`).join('')}
    </div>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="card p-4"><h3 class="font-bold text-slate-700 mb-2 text-sm">Ventas últimos 7 días</h3><canvas id="chart-ventas7"></canvas></div>
      <div class="card p-4"><h3 class="font-bold text-slate-700 mb-2 text-sm">Pedidos por estado</h3><canvas id="chart-estados"></canvas></div>
      <div class="card p-4"><h3 class="font-bold text-slate-700 mb-2 text-sm">Pedidos por torre</h3><canvas id="chart-torres"></canvas></div>
      <div class="card p-4"><h3 class="font-bold text-slate-700 mb-2 text-sm">Clientes activos vs. totales</h3><canvas id="chart-clientes"></canvas></div>
    </div>
  `;

  dibujarGraficosResumen(listaPedidos, listaClientes);
}

function ultimosNDias(n){
  const arr = [];
  for (let i=n-1;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); arr.push(d.toISOString().slice(0,10)); }
  return arr;
}

function dibujarGraficosResumen(pedidos, clientes){
  const dias = ultimosNDias(7);
  const ventasPorDia = dias.map(d => pedidos.filter(p => (p.created_at||'').slice(0,10)===d).reduce((a,p)=>a+(p.total || (PRECIOS_BIDON[p.tipo_bidon]||0)*p.cantidad),0));
  new Chart(document.getElementById('chart-ventas7'), {
    type:'line',
    data:{ labels: dias.map(d=>fechaCorta(d)), datasets:[{ label:'Ventas', data: ventasPorDia, borderColor:'#0284c7', backgroundColor:'rgba(2,132,199,.15)', fill:true, tension:.35 }] },
    options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} }
  });

  const estadosCount = ESTADOS_PEDIDO.map(e => pedidos.filter(p => normalizaEstado(p.estado)===e).length);
  new Chart(document.getElementById('chart-estados'), {
    type:'doughnut',
    data:{ labels:['Solicitado','Entregado','Cancelado'], datasets:[{ data: estadosCount, backgroundColor:['#fbbf24','#22c55e','#ef4444'] }] },
    options:{ plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:10}}}} }
  });

  /* FIX: normaliza torre (mayúsculas) para que el gráfico no separe
     "a" y "A" en barras distintas. */
  const torres = [...new Set(clientes.map(c=>normalizaTorre(c.torre)))].filter(Boolean);
  const porTorre = torres.map(t => pedidos.filter(p => normalizaTorre((clientes.find(c=>c.id===p.cliente_id)||{}).torre) === t).length);
  new Chart(document.getElementById('chart-torres'), {
    type:'bar',
    data:{ labels: torres.map(t=>'Torre '+t), datasets:[{ label:'Pedidos', data: porTorre, backgroundColor:'#0ea5e9', borderRadius:6 }] },
    options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} }
  });

  const activos = clientes.filter(c => (c.bidones_totales||0)>0).length;
  new Chart(document.getElementById('chart-clientes'), {
    type:'doughnut',
    data:{ labels:['Activos','Sin compras aún'], datasets:[{ data:[activos, Math.max(0,clientes.length-activos)], backgroundColor:['#0ea5e9','#e2e8f0'] }] },
    options:{ plugins:{legend:{position:'bottom'}} }
  });
}
</script>

    const deptos = (clientes||[]).filter(c=>normalizaTorre(c.torre)===t);

      <input id="in-buscar-admin-prod" type="text" placeholder="🔎 Buscar por nombre o categoría..." value="${BUSQUEDA_ADMIN_PRODUCTOS}"
        class="border rounded-xl px-4 py-2 text-sm flex-1">
      <span class="text-xs text-slate-400 whitespace-nowrap">${productos.length} producto(s)</span>
    </div>
    <div id="tabla-productos-wrap"></div>
  `;

  pintarTablaProductosAdmin(productos);

  document.getElementById('btn-crear-producto').addEventListener('click', async ()=>{
    const nombre = document.getElementById('prod-nombre').value.trim();
    const categoria = document.getElementById('prod-categoria').value.trim() || 'Otros';
    const precio = parseInt(document.getElementById('prod-precio').value,10);
    const emoji = document.getElementById('prod-emoji').value.trim() || '💧';
    if (!nombre || !precio) { showToast('Completa al menos nombre y precio'); return; }
    try {
      const { error } = await supabaseClient.from('productos').insert({ nombre, categoria, precio, emoji, activo:true });
      if (logSupabaseError('crear producto', error)) { showToast('No se pudo crear: ' + error.message, 4000, true); return; }
      showToast('Producto agregado ✅');
      await cargarCatalogoProductos(true);
      renderAdminProductos();
    } catch(e){ showToast('No se pudo crear (¿falta la tabla productos?): ' + (e.message||''), 4000, true); }
  });

  const inputBuscar = document.getElementById('in-buscar-admin-prod');
  inputBuscar.addEventListener('input', ()=>{
    BUSQUEDA_ADMIN_PRODUCTOS = inputBuscar.value;
    PAGINA_ADMIN_PRODUCTOS = 1;
    pintarTablaProductosAdmin(productos);
  });
}

function pintarTablaProductosAdmin(productos){
  const wrap = document.getElementById('tabla-productos-wrap');
  const filtro = BUSQUEDA_ADMIN_PRODUCTOS.trim().toLowerCase();
  const filtrados = productos.filter(p => !filtro || p.nombre.toLowerCase().includes(filtro) || (p.categoria||'').toLowerCase().includes(filtro));
  const totalPaginas = Math.max(1, Math.ceil(filtrados.length / PRODUCTOS_POR_PAGINA));
  PAGINA_ADMIN_PRODUCTOS = Math.min(PAGINA_ADMIN_PRODUCTOS, totalPaginas);
  const inicio = (PAGINA_ADMIN_PRODUCTOS-1) * PRODUCTOS_POR_PAGINA;
  const pagina = filtrados.slice(inicio, inicio + PRODUCTOS_POR_PAGINA);

  const filas = pagina.map(p => `
    <tr class="border-b hover:bg-slate-50">
      <td class="py-2 px-3 text-lg">${p.emoji||'💧'}</td>
      <td class="py-2 px-3 text-sm font-semibold"><input data-id="${p.id}" data-campo="nombre" class="in-edit-prod border rounded-lg px-2 py-1 text-sm w-full" value="${p.nombre}"></td>
      <td class="py-2 px-3 text-sm"><input data-id="${p.id}" data-campo="categoria" class="in-edit-prod border rounded-lg px-2 py-1 text-sm w-full" value="${p.categoria||''}"></td>
      <td class="py-2 px-3 text-sm"><input data-id="${p.id}" data-campo="precio" type="number" class="in-edit-prod border rounded-lg px-2 py-1 text-sm w-24" value="${p.precio}"></td>
      <td class="py-2 px-3"><button data-id="${p.id}" data-activo="${p.activo}" class="btn-toggle-producto text-xs px-2 py-1 rounded-full font-semibold ${p.activo?'bg-green-100 text-green-700':'bg-slate-100 text-slate-500'}">${p.activo?'Activo':'Inactivo'}</button></td>
      <td class="py-2 px-3"><button data-id="${p.id}" class="btn-guardar-prod text-xs text-sky-600 font-semibold">Guardar</button></td>
    </tr>`).join('');

  wrap.innerHTML = `
    <div class="card overflow-x-auto">
      <table class="w-full text-left">
        <thead class="bg-slate-50 text-xs text-slate-500 uppercase"><tr><th class="py-2 px-3"></th><th class="py-2 px-3">Nombre</th><th class="py-2 px-3">Categoría</th><th class="py-2 px-3">Precio</th><th class="py-2 px-3">Estado</th><th class="py-2 px-3"></th></tr></thead>
        <tbody>${filas || `<tr><td colspan="6" class="py-8 text-center text-slate-400">${productos.length===0 ? 'Aún no has creado productos. Agrega el primero arriba.' : 'Sin resultados para tu búsqueda.'}</td></tr>`}</tbody>
      </table>
    </div>
    ${totalPaginas>1 ? `
      <div class="flex items-center justify-center gap-3 mt-3 text-sm">
        <button id="btn-pag-prev" class="btn-ghost px-3 py-1.5" ${PAGINA_ADMIN_PRODUCTOS<=1?'disabled':''}>← Anterior</button>
        <span class="text-slate-500">Página ${PAGINA_ADMIN_PRODUCTOS} de ${totalPaginas}</span>
        <button id="btn-pag-next" class="btn-ghost px-3 py-1.5" ${PAGINA_ADMIN_PRODUCTOS>=totalPaginas?'disabled':''}>Siguiente →</button>
      </div>` : ''}
  `;

  document.querySelectorAll('.btn-toggle-producto').forEach(b => b.addEventListener('click', async ()=>{
    const activo = b.getAttribute('data-activo') === 'true';
    await supabaseClient.from('productos').update({ activo: !activo }).eq('id', b.getAttribute('data-id'));
    await cargarCatalogoProductos(true);
    renderAdminProductos();
  }));
  document.querySelectorAll('.btn-guardar-prod').forEach(b => b.addEventListener('click', async ()=>{
    const id = b.getAttribute('data-id');
    const inputs = document.querySelectorAll(`.in-edit-prod[data-id="${id}"]`);
    const patch = {};
    inputs.forEach(inp => { const campo = inp.getAttribute('data-campo'); patch[campo] = campo==='precio' ? (parseInt(inp.value,10)||0) : inp.value.trim(); });
    const { error } = await supabaseClient.from('productos').update(patch).eq('id', id);
    if (logSupabaseError('actualizar producto', error)) { showToast('Error al guardar: ' + error.message, 4000, true); return; }
    await cargarCatalogoProductos(true);
    showToast('Producto actualizado ✅');
  }));
  const btnPrev = document.getElementById('btn-pag-prev');
  const btnNext = document.getElementById('btn-pag-next');
  if (btnPrev) btnPrev.addEventListener('click', ()=>{ PAGINA_ADMIN_PRODUCTOS--; pintarTablaProductosAdmin(productos); });
  if (btnNext) btnNext.addEventListener('click', ()=>{ PAGINA_ADMIN_PRODUCTOS++; pintarTablaProductosAdmin(productos); });
}
</script>

/* ============================================================
   ADMIN — RUTA DE REPARTO 🗺️
   Diego reparte solo, físicamente. Esta pantalla junta todos los
   pedidos "Solicitados", los ordena en un recorrido lógico
   (Torre D → C → B → A, y dentro de cada torre del depto de
   número más alto al más bajo, para bajar piso por piso), y
   genera una imagen lista para compartir por WhatsApp.
   ============================================================ */
async function renderAdminEntregas(){
  const cont = document.getElementById('admin-content');
  const horario = horarioEntregaHoy();
  cont.innerHTML = `
    <h1 class="text-2xl font-bold text-slate-800 mb-1 fade-in">🗺️ Ruta de reparto</h1>
    <p class="text-slate-500 text-sm mb-4">Genera el recorrido lógico de tus entregas del día, listo para compartir por WhatsApp.</p>
    <div class="card p-5 mb-4 fade-in">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <p class="font-bold text-slate-700">📅 Horario de hoy</p>
          <p class="text-sm text-slate-500 capitalize">${fechaLarga()}</p>
          <p class="text-xs text-sky-600 font-semibold mt-0.5">${horario.esFinde?'🌤️':'🕕'} ${horario.textoLargo}</p>
        </div>
        <button id="btn-generar-ruta" class="btn-primary px-6 py-3">🗺️ Generar ruta del día</button>
      </div>
    </div>
    <div id="ruta-resultado"></div>
  `;
  document.getElementById('btn-generar-ruta').addEventListener('click', generarYPintarRuta);
  await generarYPintarRuta();
}

async function generarYPintarRuta(){
  const contResultado = document.getElementById('ruta-resultado');
  if (!contResultado) return;
  contResultado.innerHTML = skeletonHome();

  const { data: pedidos, error } = await supabaseClient
    .from('pedidos')
    .select('*, clientes(nombre, apellido, telefono, torre, depto)')
    .in('estado', ['solicitado','pendiente'])
    .order('created_at', { ascending:true });
  if (logSupabaseError('cargar pedidos para ruta', error)) {
    contResultado.innerHTML = emptyState('⚠️','No se pudo cargar la ruta', error.message||'');
    return;
  }
  const lista = pedidos || [];
  if (lista.length === 0) {
    contResultado.innerHTML = emptyState('🎉','¡No hay pedidos pendientes por entregar!','Cuando tengas pedidos solicitados, aparecerán aquí ordenados para tu ruta.');
    return;
  }

  // Trae el detalle de productos de cada pedido (en paralelo)
  const itemsPorPedido = {};
  await Promise.all(lista.map(async (p) => {
    try {
      const { data: items } = await supabaseClient.from('pedido_items').select('*').eq('pedido_id', p.id);
      itemsPorPedido[p.id] = items || [];
    } catch(e){ itemsPorPedido[p.id] = []; }
  }));

  // Orden lógico: Torre D -> C -> B -> A; dentro de cada torre, depto
  // de mayor a menor número (equivale a bajar piso por piso).
  const ordenados = lista.slice().sort((a,b)=>{
    const ta = ordenTorre(a.clientes?.torre), tb = ordenTorre(b.clientes?.torre);
    if (ta !== tb) return ta - tb;
    return numeroDepto(b.clientes?.depto) - numeroDepto(a.clientes?.depto);
  });

  const torresPresentes = [...new Set(ordenados.map(p => p.clientes?.torre ? normalizaTorre(p.clientes.torre) : '—'))];
  const totalBidones = ordenados.reduce((a,p)=>a+(p.cantidad||0),0);
  const horario = horarioEntregaHoy();

  let html = `
    <div id="ruta-captura" class="ruta-captura card p-5 mb-4">
      <div class="text-center mb-4 pb-4 border-b-2 border-sky-100">
        <p class="text-2xl font-extrabold text-sky-700">💧 AguaTorre — Ruta de reparto</p>
        <p class="text-sm text-slate-500 capitalize">${fechaLarga()}</p>
        <p class="text-xs text-slate-400 mt-1">${horario.esFinde?'🌤️':'🕕'} ${horario.textoLargo}</p>
      </div>
      <div class="flex justify-center gap-6 mb-5 text-center">
        <div><p class="text-xl font-extrabold text-sky-700">${ordenados.length}</p><p class="text-xs text-slate-500">Paradas</p></div>
        <div><p class="text-xl font-extrabold text-sky-700">${totalBidones}</p><p class="text-xs text-slate-500">Unidades</p></div>
        <div><p class="text-xl font-extrabold text-sky-700">${torresPresentes.length}</p><p class="text-xs text-slate-500">Torres</p></div>
      </div>
  `;

  let torreActual = null;
  let numeroParada = 0;
  ordenados.forEach((p) => {
    const torre = p.clientes?.torre ? normalizaTorre(p.clientes.torre) : '—';
    if (torre !== torreActual) {
      if (torreActual !== null) html += `</div>`;
      torreActual = torre;
      const countTorre = ordenados.filter(x => (x.clientes?.torre ? normalizaTorre(x.clientes.torre) : '—') === torre).length;
      html += `
        <div class="mb-4">
          <p class="font-bold text-sky-700 text-sm uppercase tracking-wide mb-2 flex items-center gap-2">🏢 Torre ${torre} <span class="text-xs text-slate-400 font-normal normal-case">(${countTorre} parada${countTorre>1?'s':''})</span></p>
      `;
    }
    numeroParada++;
    const piso = pisoDeDepto(p.clientes?.depto);
    const items = itemsPorPedido[p.id] || [];
    const itemsTexto = items.length>0 ? items.map(it=>`${it.cantidad}×${it.nombre_producto}`).join(', ') : `${p.cantidad}×${p.tipo_bidon}`;
    const esEfectivo = p.metodo_pago === 'efectivo';
    html += `
      <div class="flex items-start gap-3 py-3 ${numeroParada>1?'border-t border-slate-100':''}">
        <div class="w-8 h-8 rounded-full bg-sky-600 text-white flex items-center justify-center font-bold text-sm shrink-0">${numeroParada}</div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-extrabold text-slate-800">Depto ${p.clientes?.depto||'-'}</span>
            ${piso!=null ? `<span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">Piso ${piso}</span>` : ''}
            ${esEfectivo ? `<span class="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-semibold">💵 Cobrar ${clp(p.total||0)}</span>` : `<span class="text-xs bg-sky-100 text-sky-700 px-2 py-0.5 rounded-full font-semibold">🏦 Transferencia</span>`}
          </div>
          <p class="text-sm text-slate-600">${p.clientes?.nombre||p.nombre_solicitante||'—'} ${p.clientes?.apellido||''} ${p.clientes?.telefono?`· 📞 ${p.clientes.telefono}`:''}</p>
          <p class="text-sm text-slate-500">${itemsTexto}</p>
          ${p.indicaciones ? `<p class="text-xs text-amber-600 mt-0.5">📝 ${p.indicaciones}</p>` : ''}
        </div>
        <button data-id="${p.id}" class="btn-marcar-entregado-ruta text-xs bg-green-100 text-green-700 px-3 py-1.5 rounded-full font-semibold shrink-0" data-html2canvas-ignore="true">✅ Entregado</button>
      </div>
    `;
  });
  if (torreActual !== null) html += `</div>`;

  html += `
      <p class="text-center text-[11px] text-slate-300 mt-2">Generado con AguaTorre 💧 · ${new Date().toLocaleString('es-CL')}</p>
    </div>
    <div class="flex gap-3 mb-8">
      <button id="btn-imagen-ruta" class="btn-primary flex-1 py-3">📸 Generar imagen para WhatsApp</button>
      <button id="btn-refrescar-ruta" class="btn-ghost px-4 py-3">🔄</button>
    </div>
  `;

  contResultado.innerHTML = html;

  document.getElementById('btn-imagen-ruta').addEventListener('click', ()=>{
    capturarElementoComoImagen('ruta-captura', `ruta-aguatorre-${hoyStr()}.png`, `Ruta de reparto AguaTorre 💧 - ${ordenados.length} paradas`);
  });
  document.getElementById('btn-refrescar-ruta').addEventListener('click', generarYPintarRuta);
  document.querySelectorAll('.btn-marcar-entregado-ruta').forEach(b => b.addEventListener('click', async ()=>{
    const id = b.getAttribute('data-id');
    const pedido = ordenados.find(p=>p.id===id);
    const { error: errUpd } = await supabaseClient.from('pedidos').update({ estado:'entregado', hora_entrega: new Date().toISOString() }).eq('id', id);
    if (logSupabaseError('marcar entregado desde ruta', errUpd)) { showToast('No se pudo marcar como entregado.', 3000, true); return; }
    if (pedido && pedido.cliente_id) await crearNotificacion(pedido.cliente_id, 'pedido', '✅ Tu pedido fue entregado. ¡Gracias por preferir AguaTorre!');
    showToast('Marcado como entregado ✅');
    await generarYPintarRuta();
  }));
}
</script>

        <input id="rec-costo" type="number" placeholder="Costo en puntos" class="border rounded-lg px-2 py-2 text-sm">
      </div>
      <input id="rec-desc" placeholder="Descripción breve" class="border rounded-lg px-2 py-2 text-sm w-full mt-2">
      <button id="btn-crear-recompensa" class="btn-primary px-6 py-2 mt-3 text-sm">Crear recompensa</button>
    </div>

    <h3 class="font-bold text-slate-700 mb-2">Recompensas (${recompensas.length})</h3>
    <div class="card overflow-x-auto mb-4">
      <table class="w-full text-left"><thead class="bg-slate-50 text-xs text-slate-500 uppercase"><tr><th class="py-2 px-3">Recompensa</th><th class="py-2 px-3">Descripción</th><th class="py-2 px-3">Costo</th><th class="py-2 px-3">Estado</th></tr></thead>
      <tbody>${filasRecompensas || `<tr><td colspan="4" class="py-6 text-center text-slate-400">Aún no hay recompensas creadas.</td></tr>`}</tbody></table>
    </div>

    <h3 class="font-bold text-slate-700 mb-2">Canjes recientes (${canjes.length})</h3>
    <div class="card overflow-x-auto mb-4">
      <table class="w-full text-left"><thead class="bg-slate-50 text-xs text-slate-500 uppercase"><tr><th class="py-2 px-3">Cliente</th><th class="py-2 px-3">Recompensa</th><th class="py-2 px-3">Estado</th><th class="py-2 px-3">Actualizar</th></tr></thead>
      <tbody>${filasCanjes || `<tr><td colspan="4" class="py-6 text-center text-slate-400">Aún no hay canjes.</td></tr>`}</tbody></table>
    </div>

    <div class="card p-4">
      <h3 class="font-bold text-slate-700 mb-2">Programa de referidos</h3>
      <p class="text-sm text-slate-600">Total de invitaciones exitosas: <b>${referidos.length}</b></p>
      <p class="text-sm text-slate-600">Puntos entregados por referidos: <b>${referidos.reduce((a,r)=>a+(r.puntos_otorgados||0),0)}</b></p>
    </div>
  `;

  document.getElementById('btn-crear-recompensa').addEventListener('click', async ()=>{
    const nombre = document.getElementById('rec-nombre').value.trim();
    const tipo = document.getElementById('rec-tipo').value;
    const costo = parseInt(document.getElementById('rec-costo').value,10);
    const descripcion = document.getElementById('rec-desc').value.trim();
    if (!nombre || !costo) { showToast('Completa nombre y costo en puntos'); return; }
    try { const { error } = await supabaseClient.from('recompensas').insert({ nombre, tipo, costo_puntos:costo, descripcion, activa:true }); if (logSupabaseError('crear recompensa', error)) { showToast('No se pudo crear: '+error.message, 4000, true); return; } showToast('Recompensa creada ✅'); renderAdminGamificacion(); }
    catch(e){ showToast('No se pudo crear (¿falta la tabla recompensas?): ' + (e.message||''), 4000, true); }
  });
  document.querySelectorAll('.btn-toggle-recompensa').forEach(b => b.addEventListener('click', async ()=>{
    const activa = b.getAttribute('data-activa') === 'true';
    await supabaseClient.from('recompensas').update({ activa: !activa }).eq('id', b.getAttribute('data-id'));
    renderAdminGamificacion();
  }));

  document.querySelectorAll('.sel-canje').forEach(sel => sel.addEventListener('change', async ()=>{
    const id = sel.getAttribute('data-id');
    const nuevoEstado = sel.value;
    const canje = (canjes||[]).find(c => c.id === id);
    const { error: errUpd } = await supabaseClient.from('canjes').update({ estado: nuevoEstado }).eq('id', id);
    if (logSupabaseError('actualizar estado de canje', errUpd)) { showToast('No se pudo actualizar el canje.', 3000, true); return; }

    const nombreRecompensa = canje?.recompensas?.nombre || 'tu recompensa';
    if (canje && canje.cliente_id) {
      if (nuevoEstado === 'entregado') {
        await crearNotificacion(canje.cliente_id, 'recompensa', `✅ ¡Tu recompensa "${nombreRecompensa}" fue entregada! Gracias por usar AguaTorre.`);
      } else if (nuevoEstado === 'cancelado' && canje.estado !== 'cancelado') {
        const costo = canje.recompensas?.costo_puntos || 0;
        if (costo > 0) {
          const puntosActuales = canje.clientes?.puntos || 0;
          const { error: errRefund } = await supabaseClient.from('clientes').update({ puntos: puntosActuales + costo }).eq('id', canje.cliente_id);
          logSupabaseError('devolver puntos por canje cancelado', errRefund);
        }
        await crearNotificacion(canje.cliente_id, 'recompensa', `❌ Tu canje de "${nombreRecompensa}" fue cancelado. Te devolvimos ${costo} puntos.`);
      }
    }
    showToast('Canje actualizado ✅');
    renderAdminGamificacion();
  }));
}

async function renderAdminReportes(){
  const cont = document.getElementById('admin-content');
  const { data: pedidos } = await supabaseClient.from('pedidos').select('*');
  let items = [];
  try { const { data } = await supabaseClient.from('pedido_items').select('*'); items = data || []; } catch(e){}

  cont.innerHTML = `
    <h1 class="text-2xl font-bold text-slate-800 mb-1 fade-in">Reportes</h1>
    <p class="text-slate-500 text-sm mb-4">Análisis con datos reales de tus pedidos.</p>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="card p-4"><h3 class="font-bold text-slate-700 mb-2 text-sm">Productos más vendidos</h3><canvas id="chart-productos"></canvas></div>
      <div class="card p-4"><h3 class="font-bold text-slate-700 mb-2 text-sm">Métodos de pago</h3><canvas id="chart-pagos"></canvas></div>
    </div>
  `;
  const lista = pedidos || [];

  let etiquetasProd, valoresProd;
  if (items.length > 0) {
    const agregados = {};
    items.forEach(it => { agregados[it.nombre_producto] = (agregados[it.nombre_producto]||0) + (it.cantidad||0); });
    const top = Object.entries(agregados).sort((a,b)=>b[1]-a[1]).slice(0,8);
    etiquetasProd = top.map(t=>t[0]); valoresProd = top.map(t=>t[1]);
  } else {
    const tipos = ['20L','12L'];
    etiquetasProd = tipos.map(t=>'Bidón '+t);
    valoresProd = tipos.map(t=>lista.filter(p=>p.tipo_bidon===t).reduce((a,p)=>a+(p.cantidad||0),0));
  }
  new Chart(document.getElementById('chart-productos'), {
    type:'bar',
    data:{ labels: etiquetasProd, datasets:[{ label:'Unidades vendidas', data: valoresProd, backgroundColor:'#0ea5e9', borderRadius:6 }] },
    options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}, indexAxis: etiquetasProd.length>4 ? 'y' : 'x' }
  });
  const pagos = ['efectivo','transferencia'];
  new Chart(document.getElementById('chart-pagos'), {
    type:'pie',
    data:{ labels:['Efectivo','Transferencia'], datasets:[{ data: pagos.map(pg=>lista.filter(p=>p.metodo_pago===pg).length), backgroundColor:['#22c55e','#0ea5e9'] }] },
    options:{ plugins:{legend:{position:'bottom'}} }
  });
}

    <div class="card p-5 mb-4">

    <div class="card p-5">
      <h3 class="font-bold text-slate-700 mb-2">Acerca de</h3>
